services:
  ros:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    container_name: ros-carla
    privileged: true
    stdin_open: true
    tty: true
    runtime: nvidia
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
      - /opt/carla/v0.9.13:/opt/carla
      - ./config:/app/config
      - ./figures:/app/figures
      - ./src:/app/src
      - ./scenario_runner-0.9.13:/app/scenario_runner-0.9.13
      - ./source_env.sh:/app/source_env.sh
      - ./frames.gv:/app/frames.gv
    command: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
